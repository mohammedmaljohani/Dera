  --teal: #0e7fc4; --teal-bg: color-mix(in srgb, #0e7fc4 11%, transparent);
  --crit: #d32f43; --crit-bg: color-mix(in srgb, #d32f43 10%, transparent);
  --high: #c96a0c; --high-bg: color-mix(in srgb, #c96a0c 11%, transparent);
  --med: #a47b00; --med-bg: color-mix(in srgb, #a47b00 12%, transparent);
  --low: #5b7596; --low-bg: color-mix(in srgb, #5b7596 12%, transparent);
  --ok: #138a5e; --ok-bg: color-mix(in srgb, #138a5e 11%, transparent);
  --water: #cfe2f5; --land: #f6f8fc; --coast: #86aedb; --road: #c4d2e3; --road-hw: #8fb1da; --label: #44597a;
  --shadow: 0 1px 2px rgba(15, 32, 56, .06), 0 10px 28px rgba(15, 32, 56, .10);
  --l1: #2a9d57; --l1-bg: color-mix(in srgb, #2a9d57 12%, transparent);
  --l2: #e8710a; --l2-bg: color-mix(in srgb, #e8710a 12%, transparent);
  --l3: #d32f43; --l3-bg: color-mix(in srgb, #d32f43 11%, transparent);
  --fac: #6b46c8; --fac-bg: color-mix(in srgb, #6b46c8 11%, transparent);
  --shel: #0a8a7c; --shel-bg: color-mix(in srgb, #0a8a7c 12%, transparent);
  --unit: #1763d6; --closure: #2c3650; --route: #0e7fc4;
  --hz-flood: #2a7fd0; --hz-fire: #e0562a; --hz-collapse: #8a6a4a; --hz-evac: #7a4fd4; --hz-sand: #c49a1c; --hz-weather: #5d7694;
  --prov: #b3c2d6; --border: #8ea3bf;
  --font-ui: "Inter", "IBM Plex Sans Arabic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --bg: #0b1522; --panel: #111f31; --panel-2: #172b42; --line: #26394f;
  --fg: #e8f0fa; --fg-2: #b6c5d8; --muted: #8499b1;
  --accent: #4f9bff; --accent-bg: color-mix(in srgb, #4f9bff 16%, transparent); --on-accent: #04101f;
  --teal: #45b3f0; --teal-bg: color-mix(in srgb, #45b3f0 15%, transparent);
  --crit: #ff6676; --crit-bg: color-mix(in srgb, #ff6676 16%, transparent);
  --high: #ffa24d; --high-bg: color-mix(in srgb, #ffa24d 15%, transparent);
  --med: #f0cc4a; --med-bg: color-mix(in srgb, #f0cc4a 14%, transparent);
  --low: #8fa8c6; --low-bg: color-mix(in srgb, #8fa8c6 15%, transparent);
  --ok: #3fd49d; --ok-bg: color-mix(in srgb, #3fd49d 14%, transparent);
  --water: #0e2a47; --land: #13243a; --coast: #2d5b8c; --road: #2d4560; --road-hw: #4a74a6; --label: #9fb5cf;
  --shadow: 0 12px 32px rgba(0, 0, 0, .45);
    --l1: #46d17f; --l1-bg: color-mix(in srgb, #46d17f 16%, transparent);
  --l2: #ffa24d; --l2-bg: color-mix(in srgb, #ffa24d 16%, transparent);
  --l3: #ff6676; --l3-bg: color-mix(in srgb, #ff6676 16%, transparent);
  --fac: #b49cf5; --fac-bg: color-mix(in srgb, #b49cf5 16%, transparent);
  --shel: #3fcdb9; --shel-bg: color-mix(in srgb, #3fcdb9 16%, transparent);
  --unit: #6db0ff; --closure: #c9d3e6; --route: #45b3f0;
  --hz-flood: #4f9bff; --hz-fire: #ff7a4d; --hz-collapse: #c9a27a; --hz-evac: #b49cf5; --hz-sand: #e5bf45; --hz-weather: #9bb2cc;
  --prov: #2f4660; --border: #4d6a8c;
  color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1522; --panel: #111f31; --panel-2: #172b42; --line: #26394f;
  --fg: #e8f0fa; --fg-2: #b6c5d8; --muted: #8499b1;
  --accent: #4f9bff; --accent-bg: color-mix(in srgb, #4f9bff 16%, transparent); --on-accent: #04101f;
  --teal: #45b3f0; --teal-bg: color-mix(in srgb, #45b3f0 15%, transparent);
  --crit: #ff6676; --crit-bg: color-mix(in srgb, #ff6676 16%, transparent);
  --high: #ffa24d; --high-bg: color-mix(in srgb, #ffa24d 15%, transparent);
  --med: #f0cc4a; --med-bg: color-mix(in srgb, #f0cc4a 14%, transparent);
  --low: #8fa8c6; --low-bg: color-mix(in srgb, #8fa8c6 15%, transparent);
  --ok: #3fd49d; --ok-bg: color-mix(in srgb, #3fd49d 14%, transparent);
  --water: #0e2a47; --land: #13243a; --coast: #2d5b8c; --road: #2d4560; --road-hw: #4a74a6; --label: #9fb5cf;
  --shadow: 0 12px 32px rgba(0, 0, 0, .45);
    --l1: #46d17f; --l1-bg: color-mix(in srgb, #46d17f 16%, transparent);
  --l2: #ffa24d; --l2-bg: color-mix(in srgb, #ffa24d 16%, transparent);
  --l3: #ff6676; --l3-bg: color-mix(in srgb, #ff6676 16%, transparent);
  --fac: #b49cf5; --fac-bg: color-mix(in srgb, #b49cf5 16%, transparent);
  --shel: #3fcdb9; --shel-bg: color-mix(in srgb, #3fcdb9 16%, transparent);
  --unit: #6db0ff; --closure: #c9d3e6; --route: #45b3f0;
  --hz-flood: #4f9bff; --hz-fire: #ff7a4d; --hz-collapse: #c9a27a; --hz-evac: #b49cf5; --hz-sand: #e5bf45; --hz-weather: #9bb2cc;
  --prov: #2f4660; --border: #4d6a8c;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased; }
#root { height: 100%; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tnum { font-variant-numeric: tabular-nums; }
.label-caps { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .label-caps { letter-spacing: 0; }
.scroll-y { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.scroll-x { overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); font-weight: 500; font-size: 13px; transition: background .15s, border-color .15s, transform .05s; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
.btn-teal { background: var(--teal); border-color: var(--teal); color: var(--on-accent); font-weight: 600; }
.btn-danger { background: var(--crit); border-color: var(--crit); color: #fff; font-weight: 600; }
.btn-ghost { background: transparent; }
.btn-sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
.btn-lg { min-height: 48px; padding: 0 18px; font-size: 15px; border-radius: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 18px; border: 1px solid transparent; white-space: nowrap; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.card-sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.field { width: 100%; min-height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
textarea.field { padding: 8px 10px; }
select.field { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 17px, calc(100% - 11px) 17px; background-size: 5px 5px; background-repeat: no-repeat; padding-inline-end: 28px; }
[dir="rtl"] select.field { background-position: 16px 17px, 11px 17px; }
/* motion: subtle only */
@keyframes pulse-ring { 0% { transform: scale(.7); opacity: .75; } 80%, 100% { transform: scale(2.3); opacity: 0; } }
@keyframes sweep { to { transform: rotate(360deg); } }
@keyframes slide-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes slide-in-x { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
@keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
@keyframes blink { 50% { opacity: .25; } }
@keyframes dash { to { stroke-dashoffset: -24; } }
@keyframes bounce-dot { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-3px); opacity: 1; } }
.pulse-ring { transform-box: fill-box; transform-origin: center; animation: pulse-ring 2.2s ease-out infinite; }
.sweep { transform-origin: 12px 12px; }
.anim-in { animation: slide-in .3s ease-out both; }
.anim-in-x { animation: slide-in-x .35s ease-out both; }
.shimmer { background: linear-gradient(90deg, var(--panel-2) 0, color-mix(in srgb, var(--line) 70%, var(--panel-2)) 50%, var(--panel-2) 100%); background-size: 400px 100%; animation: shimmer 1.2s linear infinite; }
.blink { }
.flow { animation: dash 1s linear infinite; }
.typing i { display: inline-block; width: 5px; height: 5px; margin: 0 1px; border-radius: 50%; background: var(--muted); animation: bounce-dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
/* demo subtitles: a short rise and fade; fade only when the user prefers reduced motion */
@keyframes sub-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes sub-fade { from { opacity: 0; } to { opacity: 1; } }
.sub-in { animation: sub-in .35s ease-out both; }
@media (prefers-reduced-motion: reduce) { .sub-in { animation: sub-fade .35s ease-out both; } }
@media (prefers-reduced-motion: reduce) {
  .pulse-ring, .animate-ping, .animate-pulse, .sweep, .anim-in, .anim-in-x, .shimmer, .blink, .flow, .typing i { animation: none !important; }
  * { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
/* map */
.map-wrap { background: var(--water); touch-action: none; user-select: none; }
.map-wrap svg { display: block; width: 100%; height: 100%; }
.map-g { transform-origin: 0 0; }
.marker { cursor: pointer; }
.marker:focus-visible { outline: none; }
.marker:focus-visible .m-focus { stroke: var(--accent); stroke-width: 2.5; opacity: 1; }
.m-focus { fill: none; opacity: 0; }
.team-g { transition: transform .26s linear; }
.map-label { font-family: var(--font-ui); stroke-linejoin: round; }
/* phone */
.phone { width: 390px; height: 800px; max-height: calc(100vh - 140px); border-radius: 44px; border: 10px solid #05090d; background: var(--bg); box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 1.5px #2a3a4a; position: relative; overflow: hidden; display: flex; flex-direction: column; }
:root:not([data-theme="dark"]) .phone { border-color: #1b2a3d; box-shadow: 0 20px 50px rgba(15,32,56,.25), 0 0 0 1.5px #c9d6e6; }
.phone-notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 110px; height: 26px; border-radius: 16px; background: #05090d; z-index: 30; }
@media (max-width: 520px) { .phone { width: 100%; height: 100%; max-height: none; border: 0; border-radius: 0; box-shadow: none; } .phone-notch { display: none; } }
/* ticker */
.ticker-item { }
/* print-ish sitrep */
.sitrep-page { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-bg); }
.drop-ai { outline: 2px dashed var(--teal); outline-offset: -2px; }
.toast { box-shadow: var(--shadow); animation: slide-in .25s ease-out both; }

/* Print / Save as PDF: only the situation report is printed */
@media print {
  body * { visibility: hidden !important; }
  .sitrep-page, .sitrep-page * { visibility: visible !important; }
  .sitrep-page { position: absolute; inset: 0 auto auto 0; width: 100%; box-shadow: none !important; border: 0 !important; }
  html, body, #root { height: auto !important; overflow: visible !important; background: #fff !important; }
}

/* Touch targets: >=40 px on desktop, >=44 px inside the field phone */
button, select, .btn, .field { min-height: 40px !important; }
button.chip { min-height: 40px !important; }
.phone button, .phone select, .phone .btn, .phone .field { min-height: 44px !important; }
.phone nav button { min-height: 58px !important; }
button[aria-label^="Collapse"], .btn[style*="width: 28"] { min-width: 40px; }
button, .btn { min-width: 40px; }
.phone button, .phone .btn { min-width: 44px; }

/* ---- phone pass: touch targets of at least 44px. Small screens only; nothing above this line is changed. ---- */
@media (max-width: 767px) {
  button, button.chip, select, .btn, .field, [role="button"], [role="checkbox"], [role="radio"], [role="switch"], summary { min-height: 44px !important; }
  button, .btn, [role="checkbox"], [role="radio"], [role="switch"] { min-width: 44px !important; }
  /* modal backdrop is a grid whose auto column grew to the dialog width (720px); keep the column inside the screen */
  .modal-fit { grid-template-columns: minmax(0, 1fr); }
  /* dialogs: cap the height to the visible area so the bottom buttons are not hidden behind the browser toolbar (ignored where dvh is unsupported) */
  [role="dialog"][aria-modal="true"] { max-height: 92dvh !important; }
  /* small popovers (info tips, alerts, status menu) are anchored to a button that can sit near an edge; on a phone they open as a sheet that always fits */
  .pop-sheet { position: fixed !important; inset-inline: 12px !important; top: 12vh !important; top: 12dvh !important; bottom: auto !important; margin: 0 auto !important; max-height: 70vh !important; max-height: 70dvh !important; }
  .pop-sheet[role="dialog"] { overflow-y: auto; }
  /* a popover nested in another popover takes the width of the space it opens into */
  .pop-fill { width: auto !important; max-width: 100%; }
}
